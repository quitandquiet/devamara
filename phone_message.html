<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DM-style Chat UI</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/font-kopub@1.0/kopubdotum.min.css">

  <style>
    :root{
      --bg: #ffdd94;
      --frame-bg: #ffffff;
      --muted: #9aa6ad;
      --you: #d1d1d1;
      --me: #b0daff;
      --text-me: #000;
      font-family: "KopubDotum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body{
      height: 100%;
    }

    body{
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      letter-spacing: -0.5pt;
    }

    .frame{
      background: var(--frame-bg);
      width: 360px;
      height: 640px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(16,24,32,0.18);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.06);
      position: relative;
    }
  
  @media(min-width: 769px){
  .frame{
    width: calc(min(540px, 60vh * 9 / 16));
    height: calc(min(960px, 60vh));
    aspect-ratio: 9 / 16;
    border-radius: 18px;
  }
}

@media(max-width: 768px){
  body{
    padding: 0;
  }

  .frame{
    width: 100vw;
    height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
}

    .top{
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #eef3f4;
      background: linear-gradient(90deg, rgba(255,255,255,0.6), rgba(255,255,255,0.4));
      user-select: none;
    }

    .avatar{
      width: 36px;
      height: 36px;
      border-radius: 10px;
      transition: background 0.25s ease;
      background: #d1d1d1;
    }

    .title{
      font-weight: 600;
      font-size: 15px;
      color: #123;
    }

    .more-btn{
      margin-left: auto;
      cursor: pointer;
      font-size: 20px;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .more-btn:hover{
      background: rgba(0,0,0,0.06);
    }

    .menu{
      position: absolute;
      top: 58px;
      right: 12px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      overflow: hidden;
      z-index: 100;
      width: 100px;
    }

    .menu.hidden{
      display: none;
    }

    .menu button{
      width: 100%;
      border: none;
      background: #fff;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .menu button:hover{
      background: #f3f3f3;
    }

    .messages{
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: auto;
    }

    .msg-wrap{
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .msg-wrap.them{
      align-items: flex-start;
    }

    .msg-wrap.me{
      align-items: flex-end;
    }

    .bubble{
      display: inline-block;
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.35;
      font-size: 14px;
      white-space: pre-wrap;
      max-width: 74%;
      animation: messagePop 0.22s ease-out;
    }

    .from-them{
      background: var(--you);
      border-top-left-radius: 6px;
    }

    .from-me{
      background: var(--me);
      border-top-right-radius: 6px;
    }

    .time{
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .input-wrap{
      padding: 12px;
      border-top: 1px solid #eef3f4;
      display: flex;
      gap: 8px;
    }

    textarea{
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e6eef0;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .send-btn{
      background: #d1d1d1;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .popup{
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .popup.hidden{
      display: none;
    }

    .popup-inner{
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      width: 80%;
      max-width: 260px;
    }

    .popup-buttons{
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .popup-buttons button{
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #confirmDelete{
      background: #ff6961;
      color: #fff;
    }

    @keyframes messagePop{
      0%{
        opacity:0;
        transform:translateY(8px);
      }
      100%{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

<div class="frame">

  <div class="top" id="topBar">
    <div class="avatar" id="avatar"></div>

    <div class="title" id="titleName">
      guest
    </div>

    <div class="more-btn" id="moreBtn">
      ⋮
    </div>
  </div>

  <div class="menu hidden" id="menu">
    <button id="editNameBtn">이름 변경</button>
    <button id="saveTxtBtn">대화 저장</button>
    <button id="loadTxtBtn">대화 불러오기</button>
    <button id="resetChatBtn">대화 초기화</button>

    <input type="file" id="txtLoader" accept=".txt" hidden>
  </div>

  <main class="messages" id="messages"></main>

  <div class="input-wrap">
    <textarea id="input" placeholder="메시지를 입력하세요." rows="1"></textarea>
    <button id="send" class="send-btn" disabled>전송</button>
  </div>

</div>

<!-- 삭제 팝업 -->
<div id="deletePopup" class="popup hidden">
  <div class="popup-inner">
    <div>메시지를 삭제하시겠습니까?</div>

    <div class="popup-buttons">
      <button id="cancelDelete">취소</button>
      <button id="confirmDelete">삭제</button>
    </div>
  </div>
</div>

<!-- 이름 변경 팝업 -->
<div id="editNamePopup" class="popup hidden">
  <div class="popup-inner">

    <div>이름을 수정하세요</div>

    <input
      type="text"
      id="editNameInput"
      style="
        width:100%;
        margin-top:12px;
        padding:10px;
        border-radius:10px;
        border:1px solid #ccc;
      "
    >

    <div class="popup-buttons">
      <button id="cancelEdit">취소</button>
      <button id="applyName">확인</button>
    </div>
  </div>
</div>

<script>

const input = document.getElementById('input');
const send = document.getElementById('send');
const messages = document.getElementById('messages');

const topBar = document.getElementById('topBar');
const avatar = document.getElementById('avatar');

const titleName = document.getElementById('titleName');

const moreBtn = document.getElementById('moreBtn');
const menu = document.getElementById('menu');

const editNameBtn = document.getElementById('editNameBtn');

const saveTxtBtn = document.getElementById('saveTxtBtn');
const loadTxtBtn = document.getElementById('loadTxtBtn');

const resetChatBtn = document.getElementById('resetChatBtn');

const txtLoader = document.getElementById('txtLoader');

let currentMode = 'me';


function timeNow(){
  const d = new Date();

  return d.toLocaleTimeString(
    'ko-KR',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );
}


/* 메시지 추가 */

function appendMessage(text, who='me', timeOverride=null){

  const wrap = document.createElement('div');

  wrap.className =
    'msg-wrap ' +
    (who === 'me' ? 'me' : 'them');

  const bubble = document.createElement('div');

  bubble.className =
    'bubble ' +
    (who === 'me'
      ? 'from-me'
      : 'from-them');

  bubble.textContent = text;

  wrap.appendChild(bubble);

  const currentTime =
    timeOverride || timeNow();

  const lastWrap =
    messages.lastElementChild;

  if(lastWrap){

    const lastTime =
      lastWrap.querySelector('.time');

    if(
      lastTime &&
      lastTime.dataset.raw === currentTime
    ){
      lastTime.remove();
    }
  }

  const time =
    document.createElement('div');

  time.className = 'time';

  time.dataset.raw = currentTime;

  time.textContent = currentTime;

  wrap.appendChild(time);

  messages.appendChild(wrap);

  messages.scrollTop =
    messages.scrollHeight;

  saveMessages();
}


/* 입력 */

input.addEventListener('input', ()=>{

  send.disabled =
    input.value.trim().length === 0;

  input.style.height = 'auto';

  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + 'px';
});


function doSend(){

  const text =
    input.value.replace(/\n+$/, '');

  if(!text.trim()) return;

  appendMessage(
    text,
    currentMode
  );

  input.value = '';

  send.disabled = true;

  input.style.height = 'auto';
}


send.addEventListener(
  'click',
  doSend
);


input.addEventListener(
  'keydown',
  (e)=>{

    if(
      e.key === 'Enter'
      && !e.shiftKey
    ){

      e.preventDefault();

      doSend();
    }
  }
);


/* 상단 클릭 */

topBar.addEventListener(
  'click',
  (e)=>{

    if(e.target === moreBtn)
      return;

    currentMode =
      currentMode === 'me'
      ? 'them'
      : 'me';

    avatar.style.background =
      currentMode === 'me'
      ? '#d1d1d1'
      : '#b0daff';
  }
);


/* 메뉴 */

moreBtn.addEventListener(
  'click',
  (e)=>{

    e.stopPropagation();

    menu.classList.toggle('hidden');
  }
);


document.addEventListener(
  'click',
  ()=>{

    menu.classList.add('hidden');
  }
);


/* 이름 변경 */

const editNamePopup =
  document.getElementById('editNamePopup');

const editNameInput =
  document.getElementById('editNameInput');

const cancelEdit =
  document.getElementById('cancelEdit');

const applyName =
  document.getElementById('applyName');


editNameBtn.addEventListener(
  'click',
  ()=>{

    editNameInput.value =
      titleName.textContent;

    editNamePopup
      .classList
      .remove('hidden');
  }
);


cancelEdit.addEventListener(
  'click',
  ()=>{

    editNamePopup
      .classList
      .add('hidden');
  }
);


applyName.addEventListener(
  'click',
  ()=>{

    titleName.textContent =
      editNameInput.value || 'guest';

    editNamePopup
      .classList
      .add('hidden');
  }
);


/* 삭제 팝업 */

let targetMessage = null;

const deletePopup =
  document.getElementById('deletePopup');

const cancelDelete =
  document.getElementById('cancelDelete');

const confirmDelete =
  document.getElementById('confirmDelete');


messages.addEventListener(
  'click',
  (e)=>{

    const bubble =
      e.target.closest('.bubble');

    if(!bubble) return;

    targetMessage =
      bubble.parentElement;

    deletePopup
      .classList
      .remove('hidden');
  }
);


cancelDelete.addEventListener(
  'click',
  ()=>{

    deletePopup
      .classList
      .add('hidden');

    targetMessage = null;
  }
);


confirmDelete.addEventListener(
  'click',
  ()=>{

    if(targetMessage){

      targetMessage.remove();

      saveMessages();
    }

    deletePopup
      .classList
      .add('hidden');
  }
);


/* 저장 */

function saveMessages(){

  const data =
    [...document.querySelectorAll('.msg-wrap')]
    .map(w=>({

      who:
        w.classList.contains('me')
        ? 'me'
        : 'them',

      text:
        w.querySelector('.bubble')
        .textContent,

      time:
        w.querySelector('.time')
        ?.dataset.raw || ''
    }));

  localStorage.setItem(
    'chatMessages',
    JSON.stringify(data)
  );
}


/* 로딩 */

function loadMessages(){

  const data =
    JSON.parse(
      localStorage.getItem(
        'chatMessages'
      ) || '[]'
    );

  data.forEach(m=>{

    appendMessage(
      m.text,
      m.who,
      m.time
    );
  });
}


/* txt 저장 */

saveTxtBtn.addEventListener(
  'click',
  ()=>{

    const lines =
      [...document.querySelectorAll('.msg-wrap')]
      .map(w=>{

        const who =
          w.classList.contains('me')
          ? 'Admin'
          : 'Guest';

        const text =
          w.querySelector('.bubble')
          .textContent;

        const now =
          new Date();

        const date =
          `${now.getFullYear()}/` +
          `${String(now.getMonth()+1).padStart(2,'0')}/` +
          `${String(now.getDate()).padStart(2,'0')} ` +
          now.toLocaleTimeString(
            'ko-KR',
            {
              hour:'2-digit',
              minute:'2-digit'
            }
          );

        return `[${date}] [${who}] : ${text}`;
      });

    const blob =
      new Blob(
        [lines.join('\n')],
        {type:'text/plain'}
      );

    const a =
      document.createElement('a');

    a.href =
      URL.createObjectURL(blob);

    a.download = 'chat.txt';

    a.click();
  }
);


/* txt 불러오기 */

loadTxtBtn.addEventListener(
  'click',
  ()=>{

    txtLoader.click();
  }
);


txtLoader.addEventListener(
  'change',
  (e)=>{

    const file =
      e.target.files[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload = ()=>{

      messages.innerHTML = '';

      const lines =
        reader.result.split('\n');

      lines.forEach(line=>{

        const match =
          line.match(
            /\[(.*?)\] \[(.*?)\] : (.*)/
          );

        if(!match) return;

        const who =
          match[2] === 'Admin'
          ? 'me'
          : 'them';

        appendMessage(
          match[3],
          who
        );
      });

      saveMessages();
    };

    reader.readAsText(file);
  }
);


/* 초기화 */

resetChatBtn.addEventListener(
  'click',
  ()=>{

    const ok =
      confirm(
        '대화를 초기화할까요?'
      );

    if(!ok) return;

    messages.innerHTML = '';

    localStorage.removeItem(
      'chatMessages'
    );
  }
);


/* 초기 로딩 */

loadMessages();

if(messages.children.length === 0){

  appendMessage(
    '안녕! 테스트 채팅이야.',
    'them'
  );

  appendMessage(
    '오른쪽에 내가 보낸 메시지가 표시돼요.',
    'me'
  );
}

</script>

</body>
</html>
